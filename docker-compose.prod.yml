x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:?REACT_APP_API_URL is required}
        REACT_APP_SOCKET_URL: ${REACT_APP_SOCKET_URL:?REACT_APP_SOCKET_URL is required}
    container_name: rental_p2p_nginx
    restart: unless-stopped
    volumes:
      - ./nginx/${NGINX_CONF_FILE:-nginx.tunnel.conf}:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_started
    logging: *default-logging
    networks:
      - app-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rental_p2p_cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    logging: *default-logging
    networks:
      - app-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rental_p2p_backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-5000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      RABBITMQ_ENABLED: ${RABBITMQ_ENABLED:-true}
      RABBITMQ_URI: ${RABBITMQ_URI:?RABBITMQ_URI is required}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
      VNP_TMN_CODE: ${VNP_TMN_CODE:-}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET:-}
      VNP_URL: ${VNP_URL:-}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-}
      FPT_AI_API_KEY: ${FPT_AI_API_KEY:-}
      VIETTEL_AI_BASE_URL: ${VIETTEL_AI_BASE_URL:-https://viettelai.vn}
      VIETTEL_AI_TOKEN: ${VIETTEL_AI_TOKEN:-}
      VIETTEL_AI_LIVENESS_ACCEPTED_VALUES: ${VIETTEL_AI_LIVENESS_ACCEPTED_VALUES:-}
      VIETTEL_AI_LIVENESS_MIN_SCORE: ${VIETTEL_AI_LIVENESS_MIN_SCORE:-}
      VIETTEL_AI_TIMEOUT_SECONDS: ${VIETTEL_AI_TIMEOUT_SECONDS:-30}
      EKYC_SESSION_TTL_MINUTES: ${EKYC_SESSION_TTL_MINUTES:-15}
      EKYC_LIVENESS_CONTINUITY_SECONDS: ${EKYC_LIVENESS_CONTINUITY_SECONDS:-180}
      EKYC_MAX_DOCUMENT_ATTEMPTS: ${EKYC_MAX_DOCUMENT_ATTEMPTS:-3}
      EKYC_MAX_LIVENESS_RETRIES: ${EKYC_MAX_LIVENESS_RETRIES:-5}
      EKYC_POLICY_VERSION: ${EKYC_POLICY_VERSION:-2026.2-doc-liveness-5pose}
      EKYC_HMAC_SECRET: ${EKYC_HMAC_SECRET:-}
      EKYC_ENCRYPTION_KEY: ${EKYC_ENCRYPTION_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 5000) + '/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    networks:
      - app-network

  worker:
    build:
      context: ./notification-worker
      dockerfile: Dockerfile
    container_name: rental_p2p_worker
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      MONGO_URI: ${MONGO_URI:?MONGO_URI is required}
      RABBITMQ_URI: ${RABBITMQ_URI:?RABBITMQ_URI is required}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      EMAIL_HOST: ${EMAIL_HOST:?EMAIL_HOST is required}
      EMAIL_PORT: ${EMAIL_PORT:?EMAIL_PORT is required}
      EMAIL_USER: ${EMAIL_USER:?EMAIL_USER is required}
      EMAIL_PASS: ${EMAIL_PASS:?EMAIL_PASS is required}
      PDF_FONT_REGULAR: ${PDF_FONT_REGULAR:-/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf}
      PDF_FONT_BOLD: ${PDF_FONT_BOLD:-/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf}
    depends_on:
      rabbitmq:
        condition: service_healthy
    logging: *default-logging
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rental_p2p_rabbitmq
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s
    logging: *default-logging
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  rabbitmq-data:
    driver: local
