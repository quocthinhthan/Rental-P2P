# OpenAPI 3.0 Specification for P2P Rental Platform MVP (v2.2 - Final MVP)

openapi: 3.0.1
info:
  title: P2P Rental Platform API (Final MVP)
  description: |
    This is the complete and final API specification for the MVP. 
    It follows a UI-Oriented (BFF) approach and excludes Review and Chat features.
    This document serves as the definitive contract between the frontend and backend.
  version: "2.2.0"
servers:
  - url: http://localhost:5000/api
    description: Development server

tags:
  - name: Views
    description: Specialized endpoints providing aggregated data for specific UI screens.
  - name: Auth
    description: User Authentication (Register, Login, Logout).
  - name: Upload
    description: Upload media assets for items.
  - name: Items
    description: CUD (Create, Update, Delete) operations for rental items.
  - name: Rentals
    description: CUD operations for booking and managing rental transactions.
  - name: Admin
    description: Administrative operations (Requires Admin Role).
  - name: Reviews
    description: Đánh giá và tính điểm uy tín (Trust-building)
  - name: eKYC
    description: Xác minh danh tính người dùng qua Viettel AI (ID Pack Spoof Check, Document OCR, Full 5-Pose Face Liveness)

paths:
  # ===============================================================
  # View Endpoints (BFF Style)
  # ===============================================================
  /views/item-details/{id}:
    get:
      tags:
        - Views
      summary: Get all necessary data for the Item Detail page
      description: Returns aggregated item and owner details. The owner's phone number is available to authenticated users with active accounts.
      security:
        - {}
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aggregated item details, ready for UI rendering.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetailView'
        '404':
          description: Item not found

  /views/my-rentals:
    get:
      tags:
        - Views
      summary: Get all rental data for the "My Rentals" page
      description: Provides a complete picture of the user's rental activity, both as a renter and an owner.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Aggregated rental data for the current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyRentalsView'
        '401':
          description: Unauthorized

  # ===============================================================
  # Auth Endpoints
  # ===============================================================
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        $ref: '#/components/requestBodies/RegisterInput'
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Bad request (e.g., email already exists, validation failed)

  /auth/login:
    post:
      tags:
        - Auth
      summary: Login a user
      requestBody:
        $ref: '#/components/requestBodies/LoginInput'
      responses:
        '200':
          description: Login successful, returns JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
        '401':
          description: Unauthorized (invalid credentials)

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Logout the current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
        '401':
          description: Unauthorized

  /auth/me:
    get:
      tags:
        - Auth
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized
  /auth/verify-ekyc:
    post:
      deprecated: true
      tags:
        - Auth
      summary: "[Deprecated] Xác thực eKYC một bước cũ"
      description: Đã ngừng hỗ trợ. Chuyển sang quy trình phiên xác minh `/api/ekyc/sessions`.
      security:
        - bearerAuth: []
      responses:
        '410':
          description: Endpoint cũ đã ngừng hỗ trợ

  # ===============================================================
  # Viettel AI eKYC Endpoints
  # ===============================================================
  /ekyc/status:
    get:
      tags:
        - eKYC
      summary: Lấy trạng thái xác minh danh tính của tài khoản hiện tại
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Trạng thái xác minh, hiệu lực giấy tờ và phiên đang hoạt động (nếu có)

  /ekyc/sessions:
    post:
      tags:
        - eKYC
      summary: Tạo phiên xác minh danh tính (QR cho Desktop hoặc DIRECT cho Mobile)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                initiationMode:
                  type: string
                  enum: [QR, DIRECT]
      responses:
        '201':
          description: Đã tạo phiên xác minh mới
        '409':
          description: Tài khoản đã xác minh danh tính hợp lệ
        '503':
          description: Ràng buộc duy nhất của hồ sơ CCCD đang tạm thời gián đoạn

  /ekyc/sessions/claim:
    post:
      tags:
        - eKYC
      summary: Điện thoại nhận phiên xác minh một lần từ mã QR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Đổi handoff token thành ekycSessionToken ngắn hạn thành công
        '409':
          description: Mã QR đã được sử dụng trên thiết bị khác
        '410':
          description: Phiên hết hạn hoặc đã bị hủy

  /ekyc/sessions/{sessionId}:
    get:
      tags:
        - eKYC
      summary: Lấy trạng thái tiến trình của phiên xác minh
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trạng thái phiên xác minh

  /ekyc/sessions/{sessionId}/consent:
    post:
      tags:
        - eKYC
      summary: Ghi nhận đồng ý xử lý dữ liệu cá nhân trên thiết bị di động
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accepted]
              properties:
                accepted:
                  type: boolean
      responses:
        '200':
          description: Đã ghi nhận đồng ý

  /ekyc/sessions/{sessionId}/documents:
    post:
      tags:
        - eKYC
      summary: Tải lên ảnh CCCD mặt trước/mặt sau để kiểm tra giả mạo và OCR
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [frontImage, backImage]
              properties:
                frontImage:
                  type: string
                  format: binary
                backImage:
                  type: string
                  format: binary
      responses:
        '200':
          description: Kiểm tra giấy tờ và bóc tách OCR thành công
        '409':
          description: CCCD thuộc tài khoản khác hoặc khác với số đã liên kết của tài khoản hiện tại
        '422':
          description: Giấy tờ không hợp lệ, hết hạn hoặc không đọc được OCR

  /ekyc/sessions/{sessionId}/confirm-document:
    post:
      tags:
        - eKYC
      summary: Xác nhận thông tin OCR hoặc yêu cầu chụp lại giấy tờ
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [CONFIRM, RETAKE]
      responses:
        '200':
          description: Cập nhật bước xác nhận thành công

  /ekyc/sessions/{sessionId}/liveness:
    post:
      tags:
        - eKYC
      summary: Tải ảnh chụp từng tư thế khuôn mặt (Portrait, Left, Right, Top, Bottom) để kiểm tra thực thể sống
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, pose]
              properties:
                file:
                  type: string
                  format: binary
                pose:
                  type: string
                  enum: [Portrait, Left, Right, Top, Bottom]
      responses:
        '200':
          description: Tư thế hiện tại đạt yêu cầu (hoặc hoàn tất 5/5 tư thế)
        '409':
          description: Sai thứ tự tư thế, gián đoạn phiên hoặc có xung đột liên kết CCCD
        '422':
          description: Tư thế chưa đạt yêu cầu thực thể sống
        '503':
          description: Dịch vụ thực thể sống hoặc ràng buộc duy nhất của hồ sơ CCCD đang tạm thời gián đoạn

  /ekyc/sessions/{sessionId}/face:
    post:
      deprecated: true
      tags:
        - eKYC
      summary: "[Deprecated] Bước đối sánh khuôn mặt cũ đã được thay bằng /liveness"
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '410':
          description: Đã chuyển sang quy trình Full Liveness 5 tư thế

  /ekyc/sessions/{sessionId}/cancel:
    post:
      tags:
        - eKYC
      summary: Hủy phiên xác minh đang hoạt động
      parameters:
        - in: path
          name: sessionId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Đã hủy phiên và dọn dẹp dữ liệu tạm thời
  /auth/profile:
    put:
      tags:
        - Auth
      summary: Cập nhật thông tin cá nhân (Profile)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                phoneNumber:
                  type: string
                address:
                  type: string
                avatarUrl:
                  type: string
      responses:
        '200':
          description: Đã cập nhật thành công
  /auth/forgot-password:
    post:
      tags:
        - Auth
      summary: Yêu cầu khôi phục mật khẩu
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
      responses:
        '202':
          description: Đã tiếp nhận yêu cầu gửi email đặt lại mật khẩu
        '503':
          description: Tạm thời chưa thể đưa yêu cầu gửi email vào hàng đợi
  /auth/reset-password/{token}:
    put:
      tags:
        - Auth
      summary: Đặt lại mật khẩu mới
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        '200':
          description: Thành công

  # ===============================================================
  # General Purpose Endpoints (Actions)
  # ===============================================================

  # --- Upload ---
  /upload:
    post:
      tags:
        - Upload
      summary: Upload an image to Cloudinary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Image uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  imageUrl:
                    type: string
        '400':
          description: No file uploaded
        '401':
          description: Unauthorized
        '500':
          description: Upload failed
  
  # --- Items ---
  /items:
    get:
      tags:
        - Items
      summary: Lọc và tìm kiếm nâng cao (Advanced Search)
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Tìm theo tên vật phẩm
        - in: query
          name: category
          schema:
            type: string
          description: Lọc theo danh mục (VD. Công nghệ, Xe cộ)
        - in: query
          name: address
          schema:
            type: string
          description: Lọc theo vị trí/quận huyện
        - in: query
          name: startDate
          schema:
            type: string
            format: date
          description: Ngày bắt đầu cần thuê (YYYY-MM-DD)
        - in: query
          name: endDate
          schema:
            type: string
            format: date
          description: Ngày kết thúc cần thuê (YYYY-MM-DD)
        - in: query
          name: lat
          schema:
            type: number
          description: Vĩ độ của người dùng (VD 10.8231)
        - in: query
          name: lng
          schema:
            type: number
          description: Kinh độ của người dùng (VD 106.6297)
        - in: query
          name: radius
          schema:
            type: number
          description: Bán kính tìm kiếm tính bằng KM (Mặc định 5km)
      responses:
        '200':
          description: Danh sách vật phẩm tìm được

    post:
      tags:
        - Items
      summary: Create a new rental item
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateItemInput'
      responses:
        '201':
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          description: Unauthorized

  /items/{id}:
    put:
      tags:
        - Items
      summary: Update an item (only owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/CreateItemInput'
      responses:
        '200':
          description: Item updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not the owner)
        '404':
          description: Item not found
    delete:
      tags:
        - Items
      summary: Delete an item (only owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No Content (deleted successfully)
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not the owner)
        '404':
          description: Item not found

  /items/suggest-price:
    post:
      tags:
        - Items
      summary: Đề xuất giá cho thuê bằng AI (Hybrid Pricing)
      description: Nhận thông tin món đồ, sử dụng Rule-based kết hợp Gemini AI để đề xuất mức giá cho thuê theo ngày dựa trên giá trị gốc và tình trạng Cung - Cầu trên sàn.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - baseValue
              properties:
                name:
                  type: string
                  description: Tên món đồ cho thuê
                  example: "Máy ảnh Sony A6000 kèm Lens Kit"
                category:
                  type: string
                  description: Danh mục của món đồ (để AI phân tích rủi ro)
                  example: "Máy ảnh"
                description:
                  type: string
                  description: Mô tả chi tiết tình trạng, độ mới, phụ kiện đi kèm
                  example: "Mới 99%, kèm 2 pin dự phòng và túi chống sốc"
                baseValue:
                  type: number
                  description: Giá trị mua mới của món đồ (VNĐ)
                  example: 10000000
      responses:
        '200':
          description: Đề xuất giá thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  ruleBasedPrice:
                    type: number
                    description: Giá tính theo công thức % tĩnh
                    example: 150000
                  aiSuggestedPrice:
                    type: number
                    description: Giá do Gemini phân tích
                    example: 200000
                  finalSuggestion:
                    type: number
                    description: Giá đề xuất cuối cùng (Dùng số này hiển thị lên UI)
                    example: 175000
                  aiReasoning:
                    type: string
                    description: Lời giải thích của AI về việc tại sao lại đề xuất giá này
                    example: "Máy ảnh mới 99% nhưng thị trường đang dồi dào, cần mức giá vừa phải để hút khách."
                  marketContext:
                    type: string
                    description: Nhận định thị trường hiện tại
                    example: "Có 15 sản phẩm cùng danh mục đang cho thuê."
        '400':
          description: Dữ liệu đầu vào không hợp lệ (thiếu name hoặc baseValue)
        '401':
          description: Chưa xác thực (Missing or invalid token)
        '500':
          description: Lỗi server hoặc AI Engine không phản hồi

  # --- Rentals ---
  /rentals:
    post:
      tags:
        - Rentals
      summary: Create a rental request waiting for escrow payment
      description: Creates a rental with status pending_payment. The Owner is notified only after VNPay escrow succeeds.
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CreateRentalInput'
      responses:
        '201':
          description: Rental request created successfully and is waiting for payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rental'
        '400':
          description: Bad request (e.g., dates not available)
        '401':
          description: Unauthorized

  /rentals/{id}/create-vnpay-url:
    post:
      tags:
        - Rentals
      summary: Create VNPay payment URL for escrow
      description: Renter creates a VNPay Sandbox payment URL for a rental that is still pending_payment.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: VNPay payment URL created
          content:
            application/json:
              schema:
                type: object
                properties:
                  paymentUrl:
                    type: string
                    example: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html?vnp_Version=2.1.0
        '400':
          description: Rental is not waiting for payment
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not the renter)
        '404':
          description: Rental not found

  /rentals/vnpay-return:
    get:
      tags:
        - Rentals
      summary: Handle VNPay return callback
      description: VNPay redirects the browser here after payment. The backend verifies the secure hash, marks escrow as paid, moves the rental to pending_confirmation, and publishes the Owner notification.
      parameters:
        - in: query
          name: vnp_TxnRef
          schema:
            type: string
        - in: query
          name: vnp_ResponseCode
          schema:
            type: string
        - in: query
          name: vnp_SecureHash
          schema:
            type: string
      responses:
        '302':
          description: Redirects to the frontend VNPay result page after verification
        '400':
          description: Invalid signature or payment failed
        '404':
          description: Rental not found

  /rentals/{id}/confirm:
    patch:
      tags:
        - Rentals
      summary: Confirm a rental request (by item owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rental confirmed
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not the owner)
        '404':
          description: Rental not found

  /rentals/{id}/reject:
    patch:
      tags:
        - Rentals
      summary: Reject a rental request (by item owner)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rental rejected
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (not the owner)
        '404':
          description: Rental not found

  /rentals/{id}/sign-contract:
    post:
      tags:
        - Rentals
      summary: Ký hợp đồng điện tử (Vẽ chữ ký)
      description: Gửi URL hình ảnh chữ ký điện tử (vẽ bằng chuột/touch) để dán vào hợp đồng.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signatureUrl:
                  type: string
                  description: URL ảnh chữ ký (Đã upload lên Cloudinary)
      responses:
        '200':
          description: Ký hợp đồng thành công

  /rentals/{id}/contract:
    get:
      tags:
        - Rentals
      summary: Lấy chi tiết Hợp đồng điện tử
      description: Dùng để Frontend vẽ giao diện Hợp đồng (Bao gồm thông tin 2 bên, ngày ký và link ảnh chữ ký). Chỉ Owner hoặc Renter của đơn này mới xem được.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID của Đơn thuê (Rental ID)
      responses:
        '200':
          description: Trả về Object chi tiết Hợp đồng
        '403':
          description: Bạn không có quyền xem
        '404':
          description: Đơn chưa được xác nhận, chưa có hợp đồng

  /rentals/{id}/pickup:
    patch:
      tags:
        - Rentals
      summary: Lập biên bản giao nhận
      description: Người thuê hoặc chủ đồ có eKYC còn hiệu lực có thể lập biên bản một lần khi đơn đã xác nhận và hai bên đã ký hợp đồng. Đơn giữ trạng thái confirmed cho đến khi bên còn lại duyệt.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickupImages]
              properties:
                pickupImages:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: URL ảnh Cloudinary lúc giao nhận đồ
      responses:
        '200':
          description: Đã lưu biên bản giao nhận và chờ duyệt
        '403':
          description: Người gọi không thuộc đơn thuê hoặc eKYC không còn hiệu lực
        '409':
          description: Biên bản đã được lập hoặc trạng thái đơn thuê vừa thay đổi

  /rentals/{id}/complete:
    patch:
      tags:
        - Rentals
      summary: Lập biên bản trả đồ
      description: Người thuê hoặc chủ đồ có thể lập biên bản một lần khi đơn đang thuê, kể cả khi eKYC hết hạn. Đơn giữ trạng thái in_progress cho đến khi bên còn lại duyệt.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [returnImages]
              properties:
                returnImages:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: URL ảnh Cloudinary lúc trả đồ
      responses:
        '200':
          description: Đã lưu biên bản trả đồ và chờ duyệt
        '403':
          description: Người gọi không thuộc đơn thuê
        '409':
          description: Biên bản đã được lập hoặc trạng thái đơn thuê vừa thay đổi

  /rentals/{id}/approve-pickup:
    patch:
      tags: [Rentals]
      summary: Duyệt biên bản giao nhận và chuyển sang in_progress
      description: Chỉ bên còn lại được duyệt. Có thể duyệt nguyên trạng hoặc gửi ảnh Cloudinary thay thế qua pickupImages và chỉnh condition, accessories hoặc notes. Chuỗi rỗng xóa phụ kiện hoặc ghi chú.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Đã duyệt giao nhận
        '400':
          description: Trạng thái đơn hoặc nội dung chỉnh sửa không hợp lệ
        '403':
          description: Người gọi không thuộc đơn hoặc là người lập biên bản
        '409':
          description: Biên bản không thể duyệt hoặc trạng thái đơn thuê vừa thay đổi

  /rentals/{id}/approve-return:
    patch:
      tags: [Rentals]
      summary: Duyệt biên bản trả đồ và chuyển sang completed
      description: Chỉ bên còn lại được duyệt. Có thể duyệt nguyên trạng hoặc gửi ảnh Cloudinary thay thế qua returnImages và chỉnh condition, accessories, notes hoặc damages. Chuỗi rỗng xóa một trường văn bản.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Đã duyệt trả đồ
        '400':
          description: Trạng thái đơn hoặc nội dung chỉnh sửa không hợp lệ
        '403':
          description: Người gọi không thuộc đơn hoặc là người lập biên bản
        '409':
          description: Biên bản không thể duyệt hoặc trạng thái đơn thuê vừa thay đổi

  /rentals/{id}/messages:
    get:
      tags:
        - Rentals
      summary: Lấy lịch sử trò chuyện của một đơn thuê (Chat History)
      description: Tải toàn bộ tin nhắn giữa chủ đồ và người thuê. Admin cũng có thể dùng API này để đọc tin nhắn làm bằng chứng giải quyết tranh chấp.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID của đơn thuê (Rental ID)
      responses:
        '200':
          description: Tải lịch sử tin nhắn thành công
        '401':
          description: Chưa xác thực Token
        '403':
          description: Không có quyền xem hội thoại (Chỉ người thuê, chủ đồ hoặc Admin)
        '404':
          description: Không tìm thấy đơn thuê
    post:
      tags:
        - Rentals
      summary: Gửi tin nhắn mới vào đơn thuê (REST API fallback)
      description: Dùng để gửi tin nhắn thông thường nếu Frontend không muốn dùng cơ chế emit của Socket.io.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID của đơn thuê (Rental ID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: Nội dung tin nhắn
                  example: "Chào bạn, mình muốn thỏa thuận mức đền bù là 50k qua MoMo nhé!"
      responses:
        '201':
          description: Gửi tin nhắn thành công
        '400':
          description: Nội dung tin nhắn không được để trống
        '401':
          description: Chưa xác thực Token
        '403':
          description: Không có quyền tham gia hội thoại này
        '404':
          description: Không tìm thấy đơn thuê  
          
  # ===============================================================
  # Admin Endpoints
  # ===============================================================
  /admin/users:
    get:
      tags:
        - Admin
      summary: Get a list of all users
      security:
        - bearerAuth: []
      responses:
        '200':
          description: A list of all users
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)
  
  /admin/users/{id}/status:
    patch:
      tags:
        - Admin
      summary: Ban or unban a user
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isBanned:
                  type: boolean
      responses:
        '200':
          description: User status updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)

  /admin/items/{id}/status:
    patch:
      tags:
        - Admin
      summary: Update item status (e.g., delist a reported item)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [available, rented, delisted]
      responses:
        '200':
          description: Item status updated
        '401':
          description: Unauthorized
        '403':
          description: Forbidden (Admin role required)

  # ===============================================================
  # Disputes Endpoints (Báo cáo sự cố)
  # ===============================================================
  /disputes:
    post:
      tags:
        - Disputes
      summary: User Báo cáo sự cố (Đóng băng đơn thuê)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rentalId:
                  type: string
                reason:
                  type: string
                evidenceImages:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Đã báo cáo thành công
    get:
      tags:
        - Admin
      summary: Admin xem danh sách sự cố
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Danh sách disputes

  /disputes/{id}/resolve:
    patch:
      tags:
        - Disputes
      summary: Admin phán quyết tranh chấp và áp dụng chế tài lũy tiến
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID của hồ sơ tranh chấp (Dispute ID)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - adminDecision
              properties:
                adminDecision:
                  type: string
                  description: Lời giải thích/phán quyết cuối cùng của Admin
                  example: "Chủ đồ đã giao tài sản không đúng như mô tả. Quyết định hoàn tiền cho người thuê và cảnh cáo chủ đồ."
                winner:
                  type: string
                  enum: [renter, owner, none]
                  description: Người chiến thắng trong tranh chấp để hệ thống tự động xử lý tiền
                  example: "renter"
                penalizeUserId:
                  type: string
                  description: ID của User bị phạt (để trống nếu không ai bị phạt)
                  example: "64abc1234def567890"
                penaltyType:
                  type: string
                  enum: [none, warning, suspension, ban]
                  description: Hình thức kỷ luật áp dụng (Warning trừ 20đ, Suspension khóa 7 ngày + trừ 50đ, Ban khóa vĩnh viễn)
                  example: "suspension"
      responses:
        '200':
          description: Giải quyết tranh chấp thành công
        '401':
          description: Chưa xác thực (Missing Token)
        '403':
          description: Không có quyền truy cập (Admin Only)
        '404':
          description: Không tìm thấy hồ sơ sự cố
        '500':
          description: Lỗi máy chủ

  /disputes/{id}/withdraw:
    patch:
      tags:
        - Disputes
      summary: Người dùng tự rút khiếu nại (Hòa giải thành công)
      description: Cho phép người tạo báo cáo tự đóng sự cố. Hệ thống sẽ tự động đưa đơn thuê về trạng thái phù hợp (Đang thuê hoặc Hoàn tất) dựa trên thời gian thực tế của hợp đồng.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID của hồ sơ tranh chấp
      responses:
        '200':
          description: Rút khiếu nại thành công, đơn hàng mở băng
        '400':
          description: Sự cố đã bị đóng từ trước, không thể rút
        '403':
          description: Không phải người tạo khiếu nại
        '404':
          description: Không tìm thấy hồ sơ

# ===============================================================
  # Review Endpoints
  # ===============================================================
  /reviews:
    post:
      tags:
        - Reviews
      summary: Đánh giá một đơn thuê đã hoàn thành
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/ReviewInput'
      responses:
        '201':
          description: Đánh giá thành công
        '400':
          description: Đơn thuê chưa completed hoặc đã đánh giá rồi
        '403':
          description: Bạn không thuộc đơn thuê này

  /reviews/users/{userId}:
    get:
      tags:
        - Reviews
      summary: Lấy điểm uy tín và danh sách đánh giá của 1 User
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trả về trustScore và mảng reviews

# ===============================================================
# Component Schemas (Data Models)
# ===============================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # Reusable Schemas for Views
  schemas:
    UserSummary:
      type: object
      properties:
        _id:
          type: string
        fullName:
          type: string
        avatarUrl:
          type: string
          
    ItemSummary:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        category:       
          type: string
        address:        
          type: string
        pricePerDay:
          type: integer
        mainImage:
          type: string
          
    RentalDetail:
      type: object
      properties:
        _id:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true
          description: First recorded completion timestamp. Legacy records may have no stored value.
        totalPrice:
          type: integer
        escrowAmount:
          type: integer
        paymentStatus:
          type: string
          enum: [pending, escrowed, refunded]
        status:
          type: string
          enum: [pending_payment, pending_confirmation, confirmed, rejected, in_progress, completed, cancelled, disputed]
        actions:
          type: object
          description: Action eligibility for the current user in the my-rentals view.
          properties:
            canCreateDispute:
              type: boolean
              description: Available for confirmed or in-progress rentals and for seven days after completion, provided there is no active dispute.
            canWithdrawDispute:
              type: boolean
              description: Available to the reporter while the dispute is pending or escalated.
            canReview:
              type: boolean
              description: Available for seven days after completion until the current user submits a review.
            completionDeadline:
              type: string
              format: date-time
              nullable: true
              description: Inclusive deadline for new disputes and reviews on completed rentals.
        item:
          $ref: '#/components/schemas/ItemSummary'
        counterparty:
          $ref: '#/components/schemas/UserSummary'
          note: If I am the renter, this is the owner. If I am the owner, this is the renter.
          
    # Schemas for View Endpoints
    ItemDetailView:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        images:
          type: array
          items:
            type: string
        pricePerDay:
          type: integer
        address:
          type: string
        owner:
          allOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: object
              properties:
                phoneNumber:
                  type: string
                  nullable: true
                  description: Included only for authenticated users with active accounts.

    MyRentalsView:
      type: object
      properties:
        asRenter:
          type: array
          items:
            $ref: '#/components/schemas/RentalDetail'
        asOwner:
          type: array
          items:
            $ref: '#/components/schemas/RentalDetail'

    # General Purpose Schemas (Full Objects returned on CUD actions)
    User:
      type: object
      properties:
        _id:
          type: string
        fullName:
          type: string
        email:
          type: string
          format: email
        avatarUrl:
          type: string
        phoneNumber:
          type: string
        address:
          type: string
        role:
          type: string
          enum: [user, admin]
        isBanned:
          type: boolean
        createdAt:
          type: string
          format: date-time
      
    Item:
      type: object
      properties:
        _id:
          type: string
        name:
          type: string
        description:
          type: string
        images:
          type: array
          items:
            type: string
        ownerId:
          type: string
        pricePerDay:
          type: integer
        address:
          type: string
        status:
          type: string
          enum: [available, rented, delisted]
        createdAt:
          type: string
          format: date-time

    Rental:
      type: object
      properties:
        _id:
          type: string
        itemId:
          type: string
        renterId:
          type: string
        ownerId:
          type: string
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        totalPrice:
          type: integer
        escrowAmount:
          type: integer
        paymentStatus:
          type: string
          enum: [pending, escrowed, refunded]
        note:
          type: string
        status:
          type: string
          enum: [pending_payment, pending_confirmation, confirmed, rejected, in_progress, completed, cancelled]
        createdAt:
          type: string
          format: date-time

  # Reusable Request Bodies
  requestBodies:
    RegisterInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [fullName, email, password]
            properties:
              fullName:
                type: string
              email:
                type: string
              password:
                type: string
              phoneNumber:
                type: string

    LoginInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
              password:
                type: string
    CreateItemInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name, pricePerDay, baseValue]
            properties:
              name:
                type: string
              description:
                type: string
              category:        
                type: string
              pricePerDay:
                type: integer
              baseValue:
                type: integer
                description: Giá trị gốc của tài sản (VNĐ)
              depositPercentage:
                type: integer
                description: "Phần trăm đặt cọc (VD: 100 là 100%)"
              address:
                type: string
              images:
                type: array
                items:
                  type: string
              lat:
                type: number
                description: Vĩ độ nơi để đồ vật
              lng:
                type: number
                description: Kinh độ nơi để đồ vật
    CreateRentalInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [itemId, startDate, endDate]
            properties:
              itemId:
                type: string
              startDate:
                type: string
                format: date
              endDate:
                type: string
                format: date
    ReviewInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [rentalId, rating]
            properties:
              rentalId:
                type: string
                description: ID của đơn thuê đã Completed
              rating:
                type: integer
                minimum: 1
                maximum: 5
                description: Số sao (từ 1 đến 5)
              comment:
                type: string
                description: Nhận xét chi tiết
